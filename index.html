<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
    <section id="landing-page">
    <nav>
        <ul class="nav__link--list">
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor 
                    ">Home</a>
                </li>
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor 
                    ">Movies</a>
                </li>
                <li class="nav__link">
                    <a href="#" id="contactLink" class="nav__link--anchor">
                    Contact
                    </a>
                </li>
                
        </ul>
            <div id="emailMenu" style="display: none;">
                <form>
                    <label for="email">Your Email:</label>
                    <input 
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                    <button type="submit" class="send__btn">Send</button>
                </form>
            </div>
    
    
        <div class="burger-menu" id="burgerMenu">
            &#9776; <!-- This is the hamburger icon -->
        </div>
        <ul class="nav-links" id="navLinks">
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
            <a href="#contact">Contact</a>
        </ul>
    </nav>

    </section>
   
    <header class="heading">
        <h1 class="h1">Movie Search</h1>
        <h2 class="h2">Thousands of Movies to Watch</h2>
        <title class="title">Movie Search</title>
    <div class="results__container">
        <h3 class="h3">Search Movies</h3>
        <input type="text" id="searchInput" placeholder="Search for a movie...">
        <select id="filterSelect">
            <option class="result" value="all">All</option>
            <option class="result" value="newest">Newest</option>
            <option class="result" value="oldest">Oldest</option>
            <option class="result" value="a-z">A-Z</option>
            <option class="result" value="z-a">Z-A</option>
        </select>
        <button id="searchBtn">Search</button>
        <div id="results"></div>
    </div>
    </header>

    
    <main>
        <main>
            <div id="loading" style="display: none;">Loading...</div>
            <div id="results"></div>
        </main>
    <footer class="footer">
        <div class="container">
            <div class="row footer__row">
                <a href="#" class="footer__anchor">
                    <figure class="footer__logo">
                    <img id="personal-logo" src="./assets/jennes-logo2.PNG" alt="my personal logo">
                    </figure>
                        <span class="footer__logo--popper">
                            Top
                            <i class="fas fa-arrow-up"></i>
                        </span>
                </a>
            </div>
        </div>
        <p class="footer__para">&copy; 2026 Movie Search by Jennifer Erving</p>
        
    </footer>
</body> 
</html>
